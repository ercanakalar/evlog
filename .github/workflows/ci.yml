name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/home-tracker/api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: evlog
          POSTGRES_PASSWORD: postgresql
          POSTGRES_DB: evlog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evlog" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://evlog:postgresql@localhost:5432/evlog
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/home-tracker/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  mobile-react-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/home-tracker/mobile-react-native
    env:
      EXPO_PUBLIC_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/home-tracker/mobile-react-native/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  raf-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/shelf-tracker/raf-api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: evlog
          POSTGRES_PASSWORD: postgresql
          POSTGRES_DB: raf
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U evlog" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://evlog:postgresql@localhost:5433/raf
      ONNXRUNTIME_NODE_INSTALL: skip # no GPU libraries
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/shelf-tracker/raf-api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  raf-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/shelf-tracker/raf-mobile
    env:
      EXPO_PUBLIC_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/shelf-tracker/raf-mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
