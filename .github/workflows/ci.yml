name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: raf
          POSTGRES_PASSWORD: raf
          POSTGRES_DB: raf
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U raf" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://raf:raf@localhost:5433/raf
      ONNXRUNTIME_NODE_INSTALL: skip # no GPU libraries
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  mobile-react-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-react-native
    env:
      EXPO_PUBLIC_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile-react-native/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
