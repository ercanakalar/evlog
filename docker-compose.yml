# Local development with Docker. See "Run with Docker" in README.md.
#
#   docker compose up -d db                # Postgres, if you don't run your own
#   docker compose up -d --build backend   # the API on port 3000
#   docker compose run --rm mobile         # Expo's dev server (interactive)
#   docker compose logs -f backend
#   docker compose down
#
# The API and Expo use this computer's network: the API reads DATABASE_URL from
# backend/.env just as `npm run start:dev` does (localhost works), and phones
# reach both on this computer's LAN IP.
services:
  # Postgres for the API, on port 5433. Only started when named.
  db:
    image: postgres:18-alpine
    profiles: [db]
    environment:
      POSTGRES_USER: raf
      POSTGRES_PASSWORD: raf
      POSTGRES_DB: raf
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U raf']
      interval: 5s
      timeout: 3s
      retries: 10

  # The API with its receipt reader, built like the Cloud Run image.
  backend:
    build: ./backend
    restart: unless-stopped
    network_mode: host
    env_file: ./backend/.env
    environment:
      UPLOAD_DIR: /app/uploads
    command: sh -c "npx prisma migrate deploy && exec node dist/main"
    volumes:
      - uploads:/app/uploads

  # Expo's dev server for a development build on your phone (npm run android once).
  # EXPO_PUBLIC_API_URL comes from mobile-react-native/.env.
  mobile:
    image: node:24-bookworm
    profiles: [mobile]
    network_mode: host
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npx expo start --lan"
    volumes:
      - ./mobile-react-native:/app
      - /app/node_modules
    stdin_open: true
    tty: true

volumes:
  pgdata:
  uploads:
