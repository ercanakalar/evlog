# Local development with Docker. See "Run with Docker" in README.md.
#
#   docker compose up -d --build api raf-api   # both APIs + Evlog's receipt reader
#   docker compose up -d --build api           # just Evlog (+ reader)
#   docker compose up -d --build raf-api       # just Raf (its reader is built in)
#   docker compose up -d db raf-db             # optional: Postgres in Docker
#   docker compose logs -f api raf-api receipt-reader
#   docker compose down
#
# The APIs use the host's network, so they read DATABASE_URL and
# OCR_SERVICE_URL from apps/*/*/.env exactly like running them with npm does
# (localhost works) and phones reach them on this computer's LAN IP.
services:
  # Postgres in Docker, for when you don't run your own. Only started when
  # named (`docker compose up -d db raf-db`); point DATABASE_URL at it.
  db:
    image: postgres:18-alpine
    profiles: [db]
    environment:
      POSTGRES_USER: evlog
      POSTGRES_PASSWORD: evlog
      POSTGRES_DB: evlog
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U evlog']
      interval: 5s
      timeout: 3s
      retries: 10

  # Raf runs on its own Postgres server and port.
  raf-db:
    image: postgres:18-alpine
    profiles: [db]
    environment:
      POSTGRES_USER: raf
      POSTGRES_PASSWORD: raf
      POSTGRES_DB: raf
    ports:
      - '5433:5432'
    volumes:
      - raf-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U raf']
      interval: 5s
      timeout: 3s
      retries: 10

  # Evlog API on port 3000 (PORT in apps/home-tracker/api/.env).
  api:
    build: ./apps/home-tracker/api
    network_mode: host
    depends_on: [receipt-reader]
    env_file: ./apps/home-tracker/api/.env
    environment:
      UPLOAD_DIR: /app/uploads
    command: sh -c "npx prisma migrate deploy && node dist/main"
    volumes:
      - uploads:/app/uploads

  # Raf API on port 3100 (PORT in apps/shelf-tracker/raf-api/.env).
  raf-api:
    build: ./apps/shelf-tracker/raf-api
    restart: unless-stopped
    network_mode: host
    env_file: ./apps/shelf-tracker/raf-api/.env
    environment:
      UPLOAD_DIR: /app/uploads
    command: sh -c "npx prisma migrate deploy && node dist/main"
    volumes:
      - raf-uploads:/app/uploads

  # Evlog's receipt reader (Raf's is built into its API). Code is mounted and reloaded on save, so
  # edits to the .py files apply without a rebuild; rebuild after changing
  # requirements.txt.
  receipt-reader:
    build: ./services/receipt-reader
    restart: unless-stopped
    environment:
      OCR_SERVICE_TOKEN: ${OCR_SERVICE_TOKEN:-change-me-ocr-token}
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/receipt-reader:/app
    ports:
      # Only this computer can reach it; the APIs call http://localhost:8000.
      - '127.0.0.1:8000:8000'

volumes:
  pgdata:
  uploads:
  raf-pgdata:
  raf-uploads:
