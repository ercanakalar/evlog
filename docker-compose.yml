# Local development: Postgres + the API.
#   docker compose up -d db          # just the database
#   docker compose up --build        # database + API
#   docker compose up -d receipt-reader  # just the receipt reader
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: evlog
      POSTGRES_PASSWORD: evlog
      POSTGRES_DB: evlog
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U evlog']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    depends_on:
      db:
        condition: service_healthy
    env_file: ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://evlog:evlog@db:5432/evlog?schema=public
      OCR_SERVICE_URL: http://receipt-reader:8000
      UPLOAD_DIR: /app/uploads
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: sh -c "npx prisma migrate deploy && node dist/main"
    ports:
      - '3000:3000'
    volumes:
      - uploads:/app/uploads

  # Receipt reader. Code is mounted and reloaded on save, so edits to
  # app.py apply without a rebuild; rebuild after changing requirements.txt.
  receipt-reader:
    build: ./services/receipt-reader
    restart: unless-stopped
    environment:
      OCR_SERVICE_TOKEN: ${OCR_SERVICE_TOKEN:-change-me-ocr-token}
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/receipt-reader:/app
    ports:
      # Only this computer can reach it; the API calls http://localhost:8000.
      - '127.0.0.1:8000:8000'

volumes:
  pgdata:
  uploads:
